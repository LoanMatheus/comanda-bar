name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main

  # Permite executar manualmente pela aba Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Checkout
        uses: actions/checkout@v6

      # Configura Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Necessário principalmente para Yarn moderno
      - name: Enable Corepack
        run: corepack enable

      # Detecta automaticamente Yarn ou npm
      - name: Detect package manager
        id: package-manager
        shell: bash
        run: |
          if [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "Package manager detectado: Yarn"

          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "Package manager detectado: npm"

          else
            echo "ERRO: Nenhum lockfile encontrado."
            echo "Adicione yarn.lock ou package-lock.json ao repositório."
            exit 1
          fi

      # Yarn
      - name: Install dependencies with Yarn
        if: steps.package-manager.outputs.manager == 'yarn'
        shell: bash
        run: |
          echo "Instalando dependencias com Yarn..."

          if yarn install --immutable; then
            echo "Dependencias instaladas com Yarn moderno."
          else
            echo "Tentando Yarn Classic..."
            yarn install --frozen-lockfile
          fi

      # npm
      - name: Install dependencies with npm
        if: steps.package-manager.outputs.manager == 'npm'
        run: npm ci

      # Build usando Yarn
      - name: Build with Yarn
        if: steps.package-manager.outputs.manager == 'yarn'
        run: yarn build

      # Build usando npm
      - name: Build with npm
        if: steps.package-manager.outputs.manager == 'npm'
        run: npm run build

      # Confirma que o Next.js realmente gerou o export
      - name: Verify static export
        shell: bash
        run: |
          if [ ! -d "out" ]; then
            echo "ERRO: A pasta 'out' nao foi criada."
            echo "Verifique se next.config possui output: 'export'."
            exit 1
          fi

          echo "Static export encontrado:"
          ls -la out

      # Prepara o GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Envia a pasta /out para o GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
